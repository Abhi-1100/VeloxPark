<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" role="img" aria-labelledby="title">
  <title id="title">VeloxPark Official App Icon</title>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="vpBgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>

    <!-- Golden Glow Filter -->
    <filter id="vpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Translucent Gold Fill -->
    <linearGradient id="vpFill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2C230" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Outer Gold Stroke Gradient -->
    <linearGradient id="vpStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E5AA10"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="256" height="256" rx="56" fill="url(#vpBgGrad)" stroke="#222222" stroke-width="1.5"/>

  <!-- Subtle Street / Map Grid Lines -->
  <g stroke="#F2C230" stroke-opacity="0.10" stroke-width="2.5" stroke-linecap="round">
    <path d="M -10 75 L 266 55" />
    <path d="M -10 170 L 266 148" />
    <path d="M -10 220 L 266 205" />
    <path d="M 80 -10 L 60 266" />
    <path d="M 185 -10 L 195 266" />
    <path d="M 135 63 L 130 150" stroke-width="2" stroke-opacity="0.08" />
  </g>

  <!-- Glowing Geometric "P" Parking Zone Polygon (Halo) -->
  <path 
    d="M 80 71 L 186 60 L 196 146 L 126 156 L 105 206 L 72 197 Z" 
    fill="none" 
    stroke="#FFD700" 
    stroke-width="14" 
    stroke-linejoin="round" 
    stroke-linecap="round"
    opacity="0.32"
    filter="url(#vpGlow)"
  />

  <!-- Main Geometric "P" Polygon -->
  <path 
    d="M 80 71 L 186 60 L 196 146 L 126 156 L 105 206 L 72 197 Z" 
    fill="url(#vpFill)" 
    stroke="url(#vpStroke)" 
    stroke-width="9" 
    stroke-linejoin="round" 
    stroke-linecap="round"
  />

  <!-- Internal Parking Slot Guide Lines -->
  <path d="M 126 68 L 123 125" stroke="#FFE169" stroke-width="2" stroke-opacity="0.28" stroke-linecap="round" />
</svg>
