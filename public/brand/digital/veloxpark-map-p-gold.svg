<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>

    <!-- Golden Neon Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Translucent gold fill gradient -->
    <linearGradient id="innerFill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F2C230" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1F1F1F" stroke-width="2"/>

  <!-- Subtle Street / Map Grid Lines (Cyberpunk / Modern GPS aesthetic) -->
  <g stroke="#F2C230" stroke-opacity="0.10" stroke-width="5" stroke-linecap="round">
    <!-- Horizontal street lines -->
    <path d="M -20 150 L 532 110" />
    <path d="M -20 340 L 532 295" />
    <path d="M -20 440 L 532 410" />
    <!-- Vertical street lines -->
    <path d="M 160 -20 L 120 532" />
    <path d="M 370 -20 L 390 532" />
    <path d="M 270 125 L 260 300" stroke-width="4" stroke-opacity="0.08" />
  </g>

  <!-- Glowing Geometric "P" Parking Zone Polygon -->
  <!-- Outer Glow Halo -->
  <path 
    d="M 160 142 L 372 120 L 392 292 L 252 312 L 210 412 L 144 394 Z" 
    fill="none" 
    stroke="#FFD700" 
    stroke-width="28" 
    stroke-linejoin="round" 
    stroke-linecap="round"
    opacity="0.35"
    filter="url(#goldGlow)"
  />

  <!-- Main Geometric 'P' Polygon (Exact match to reference shape) -->
  <path 
    d="M 160 142 L 372 120 L 392 292 L 252 312 L 210 412 L 144 394 Z" 
    fill="url(#innerFill)" 
    stroke="#FFD700" 
    stroke-width="18" 
    stroke-linejoin="round" 
    stroke-linecap="round"
  />

  <!-- Subtle Internal Parking Slot Indicator Lines -->
  <path d="M 252 135 L 246 250" stroke="#FFD700" stroke-width="4" stroke-opacity="0.22" stroke-linecap="round" />
</svg>
