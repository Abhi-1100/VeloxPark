<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 256" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">VeloxPark horizontal logo</title>
  <desc id="desc">VeloxPark Official Geometric P Parking Logo with wordmark.</desc>
  <defs>
    <radialGradient id="hBgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="hStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E5AA10"/>
    </linearGradient>
    <linearGradient id="hFill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2C230" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Official Geometric P Icon Symbol -->
  <g id="symbol" transform="translate(0 0)">
    <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#hBgGrad)" stroke="#222222" stroke-width="1.5"/>
    <g stroke="#F2C230" stroke-opacity="0.10" stroke-width="2.5" stroke-linecap="round">
      <path d="M -10 75 L 266 55" />
      <path d="M -10 170 L 266 148" />
      <path d="M 80 -10 L 60 266" />
      <path d="M 185 -10 L 195 266" />
    </g>
    <path 
      d="M 80 71 L 186 60 L 196 146 L 126 156 L 105 206 L 72 197 Z" 
      fill="url(#hFill)" 
      stroke="url(#hStroke)" 
      stroke-width="9" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />
    <path d="M 126 68 L 123 125" stroke="#FFE169" stroke-width="2" stroke-opacity="0.28" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g id="wordmark" fill="#F5F5F0">
    <path d="M292 86h18l18 58 18-58h18l-26 84h-20l-26-84Z"/>
    <path d="M376 86h57v16h-39v17h35v16h-35v19h40v16h-58V86Z"/>
    <path d="M449 86h18v68h39v16h-57V86Z"/>
    <path fill-rule="evenodd" d="M518 86h18l27 84h-19l-5-17h-25l-5 17h-18l27-84Zm0 51h17l-8-30-9 30Z"/>
    <path d="m566 86 21 30 20-30h21l-31 42 32 42h-22l-20-30-21 30h-21l32-42-31-42h21Z"/>
    <path fill-rule="evenodd" d="M645 86h34c21 0 34 11 34 29 0 12-6 21-17 25l20 30h-21l-16-26h-16v26h-18V86Zm18 16v26h14c11 0 17-5 17-13s-6-13-17-13h-14Z"/>
    <path d="M726 86h18v31l27-31h23l-31 38 33 46h-23l-22-32-7 8v24h-18V86Z"/>
  </g>
</svg>
